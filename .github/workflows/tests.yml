name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build single-file plugin
        run: python3 plugin/build_single_file.py

      - name: Build Orca Cloud artifact
        run: python3 plugin/build_hub_file.py

      - name: Compile all plugin builds
        run: |
          python3 -m py_compile \
            plugin/filament_match.py \
            plugin/filament_match_core.py \
            plugin/filament_match_sources.py \
            plugin/dist/filament_match.py \
            plugin/hub/filament_match_any.py \
            plugin/dev/orca_hub.py

      - name: Run tests
        run: python3 -m unittest discover -s plugin/tests -p 'test_*.py' -v
