name: Hub metadata probe

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Orca Cloud API with the publishing OIDC token
        run: |
          set -euo pipefail
          token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          plugin_id="3031b85e-07ce-4925-90fa-ba93ccde1c53"
          for path in "/api/v1/plugins/mine" "/api/v1/plugins/$plugin_id"; do
            echo "--- GET $path"
            curl -sS -o response.json -w 'HTTP %{http_code}\n' \
              -H "Authorization: Bearer $token" \
              "https://api.orcaslicer.com$path"
            head -c 1200 response.json
            echo
          done
